<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PaintSheep</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #f5e6d3;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #game-container {
            width: 100%;
            height: 100%;
            max-width: 430px;
            max-height: 100%;
            aspect-ratio: 9 / 16;
            background: #f5e6d3;
            position: relative;
        }
        @media (min-aspect-ratio: 9/16) {
            #game-container {
                width: auto;
                height: 100dvh;
            }
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading-screen" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f5e6d3;z-index:9999;">
            <div style="font-family:Jua,sans-serif;font-size:20px;color:#888;">Loading...</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
